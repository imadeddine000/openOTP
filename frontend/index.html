<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>openOTP — SMS Gateway API</title>
  <style>
    :root { --bg:#0f1115; --card:#171a21; --border:#262b36; --text:#e6e8ec; --muted:#8b94a5; --accent:#ff7a18; --green:#22c55e; --red:#ef4444; --blue:#3b82f6; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
    a { color:var(--accent); text-decoration:none; }
    code { font-family:Consolas,Menlo,monospace; }

    /* ============ app shell (sidebar layout) ============ */
    .shell { display:flex; min-height:100vh; }
    .sidebar { width:236px; min-width:236px; background:var(--card); border-right:1px solid var(--border); display:flex; flex-direction:column; position:sticky; top:0; height:100vh; padding:18px 14px; }
    .sidebar-brand { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:2px 10px 16px; }
    .logo { font-weight:800; font-size:17px; letter-spacing:.3px; cursor:pointer; }
    .sidebar-app { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:#ff9a4d; background:rgba(255,122,24,.14); border:1px solid rgba(255,122,24,.3); padding:3px 9px; border-radius:20px; }
    .sidenav { display:flex; flex-direction:column; gap:4px; flex:1; overflow-y:auto; }
    .sidenav-item { display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:none; border:none; color:var(--muted); padding:10px 12px; border-radius:8px; cursor:pointer; font-size:14px; font-weight:600; font-family:inherit; }
    .sidenav-item:hover { color:var(--text); background:rgba(255,255,255,.04); }
    .sidenav-item.active { color:var(--accent); background:rgba(255,122,24,.12); }
    .sidenav-icon { font-size:16px; width:20px; text-align:center; }
    .sidebar-foot { border-top:1px solid var(--border); padding-top:12px; display:flex; flex-direction:column; gap:6px; }
    .sidebar-user { font-size:12px; color:var(--muted); word-break:break-all; padding:0 10px; }
    .linkish { background:none; border:none; color:var(--muted); cursor:pointer; font-size:12px; text-align:left; padding:4px 10px; font-family:inherit; }
    .linkish:hover { color:var(--red); }
    .main { flex:1; padding:26px 30px; min-width:0; max-width:1280px; }
    .page-title { font-size:22px; font-weight:800; margin-bottom:18px; }
    .toolbar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
    .spacer { flex:1; }
    @media (max-width:860px) {
      .shell { flex-direction:column; }
      .sidebar { width:100%; min-width:0; height:auto; position:static; }
      .sidenav { flex-direction:row; overflow-x:auto; }
      .sidenav-item { white-space:nowrap; padding:8px 12px; }
      .sidebar-foot { flex-direction:row; align-items:center; justify-content:space-between; }
      .main { padding:18px 14px; }
    }

    /* ============ landing page ============ */
    .landing { min-height:100vh; }
    .lnav { display:flex; align-items:center; justify-content:space-between; padding:14px 28px; border-bottom:1px solid var(--border); position:sticky; top:0; background:rgba(15,17,21,.88); backdrop-filter:blur(10px); z-index:20; }
    .lnav .logo { font-size:18px; }
    .lhero { position:relative; text-align:center; padding:96px 24px 80px; max-width:920px; margin:0 auto; overflow:hidden; }
    .lhero::before { content:''; position:absolute; inset:0; background:radial-gradient(900px 420px at 70% -10%, rgba(255,122,24,.20), transparent 65%), radial-gradient(700px 380px at 8% 15%, rgba(255,122,24,.09), transparent 60%); pointer-events:none; }
    .lhero > * { position:relative; }
    .pill { display:inline-block; font-size:11px; font-weight:700; letter-spacing:1.4px; text-transform:uppercase; color:#ff9a4d; background:rgba(255,122,24,.10); border:1px solid rgba(255,122,24,.35); padding:6px 14px; border-radius:30px; }
    .lhero h1 { font-size:clamp(34px,6vw,58px); line-height:1.08; font-weight:800; margin:24px 0 18px; letter-spacing:-1px; }
    .grad-text { background:linear-gradient(90deg,#ff7a18,#ffb066); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:transparent; }
    .lhero .sub { color:var(--muted); font-size:17px; max-width:620px; margin:0 auto 34px; line-height:1.65; }
    .cta-row { display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }
    .btn-cta { padding:15px 32px; border-radius:11px; border:none; background:linear-gradient(90deg,#ff7a18,#ff9040); color:#fff; font-size:16px; font-weight:700; cursor:pointer; font-family:inherit; box-shadow:0 8px 28px rgba(255,122,24,.28); }
    .btn-cta:hover { filter:brightness(1.07); }
    .btn-ghost { padding:15px 28px; border-radius:11px; border:1px solid var(--border); background:rgba(255,255,255,.02); color:var(--text); font-size:15px; font-weight:600; cursor:pointer; font-family:inherit; }
    .btn-ghost:hover { border-color:var(--accent); color:var(--accent); }
    .lsection { max-width:1080px; margin:0 auto; padding:64px 24px; }
    .lsection h2 { font-size:30px; font-weight:800; text-align:center; margin-bottom:12px; letter-spacing:-.5px; }
    .lsection .sub { text-align:center; color:var(--muted); margin-bottom:42px; font-size:15px; }
    .feat-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px; }
    .feat { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:26px; transition:border-color .15s; }
    .feat:hover { border-color:rgba(255,122,24,.45); }
    .feat .ic { font-size:26px; margin-bottom:14px; }
    .feat h3 { font-size:16px; margin-bottom:8px; }
    .feat p { color:var(--muted); font-size:13.5px; line-height:1.65; }
    .steps { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:16px; }
    .step { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:26px; }
    .step .num { width:34px; height:34px; border-radius:50%; background:rgba(255,122,24,.14); border:1px solid rgba(255,122,24,.4); color:var(--accent); font-weight:800; display:flex; align-items:center; justify-content:center; margin-bottom:14px; }
    .step h3 { font-size:15px; margin-bottom:8px; }
    .step p { color:var(--muted); font-size:13px; line-height:1.6; }
    .codecard { background:var(--card); border:1px solid var(--border); border-radius:14px; text-align:left; max-width:780px; margin:46px auto 0; overflow:hidden; }
    .codecard .head { display:flex; gap:8px; padding:12px 16px; border-bottom:1px solid var(--border); align-items:center; }
    .codecard .fname { margin-left:8px; font-size:12px; color:var(--muted); }
    .dot { width:11px; height:11px; border-radius:50%; }
    .codecard pre { margin:0; padding:20px 22px; overflow-x:auto; font-size:13px; line-height:1.75; color:#c9d1e0; }
    .codecard .cmt { color:#5c6675; }
    .codecard .str { color:#7ee787; }
    .codecard .k { color:#ff9a4d; }
    .cta-banner { max-width:1080px; margin:20px auto 80px; padding:52px 24px; text-align:center; border-radius:20px; background:linear-gradient(135deg, rgba(255,122,24,.16), rgba(255,122,24,.03)); border:1px solid rgba(255,122,24,.3); }
    .cta-banner h2 { font-size:28px; font-weight:800; margin-bottom:10px; }
    .cta-banner p { color:var(--muted); margin-bottom:26px; }
    .lfooter { border-top:1px solid var(--border); padding:24px 28px; display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; color:var(--muted); font-size:13px; }
    .lfooter .links { display:flex; gap:18px; align-items:center; }
    .lfooter a:hover { text-decoration:underline; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
