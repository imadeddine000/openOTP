<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>openOTP — SMS Gateway</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ---- textbee-faithful design tokens ---- */
:root{
  --background:#faf7f0; --foreground:#1c1a17; --shell:#f3ede1; --card:#ffffff;
  --muted:#f0ebe0; --muted-foreground:#6b655b; --subtle:#8a8478;
  --border:#e8e2d4; --input:#e8e2d4; --ring:#ea580c;
  --primary:#ea580c; --primary-hover:#c2410c; --primary-fg:#ffffff;
  --destructive:#dc2626; --success:#16a34a; --warning:#d97706;
  --radius:12px; --sidebar-w:240px; --header-h:56px;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
.dark{
  --background:#2b2722; --foreground:#e5e3df; --shell:#232019; --card:#2b2722;
  --muted:#3a352e; --muted-foreground:#a8a39a; --subtle:#8a8478;
  --border:#423d35; --input:#423d35; --ring:#f97316;
  --primary:#f97316; --primary-hover:#ea580c; --primary-fg:#241308;
  --destructive:#f87171; --success:#4ade80; --warning:#fbbf24;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--background);color:var(--foreground);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:clip}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,textarea,select{font-family:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted-foreground)}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:500;border-radius:8px;padding:8px 14px;transition:all .15s;white-space:nowrap;line-height:1}
.btn-primary{background:var(--primary);color:var(--primary-fg)}
.btn-primary:hover{background:var(--primary-hover)}
.btn-outline{border:1px solid var(--input);background:var(--card);color:var(--foreground)}
.btn-outline:hover{background:var(--muted)}
.btn-ghost{color:var(--foreground)}
.btn-ghost:hover{background:var(--muted)}
.btn-destructive{color:var(--destructive)}
.btn-destructive:hover{background:rgba(220,38,38,.08)}
.btn-sm{padding:6px 12px;font-size:13px}
.btn-lg{padding:10px 18px;font-size:15px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}

/* ---- cards ---- */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius)}
.card-pad{padding:20px}
.card-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.card-title{font-size:15px;font-weight:600}
.card-desc{font-size:13px;color:var(--muted-foreground);margin-top:2px}

/* ---- inputs ---- */
.input,.textarea,.select{width:100%;border:1px solid var(--input);border-radius:8px;padding:9px 12px;font-size:14px;background:var(--card);color:var(--foreground);transition:border .15s,box-shadow .15s}
.input:focus,.textarea:focus,.select:focus{outline:none;border-color:var(--ring);box-shadow:0 0 0 3px rgba(234,88,12,.12)}
.textarea{resize:vertical;min-height:80px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:500}
.field .hint{font-size:12px;color:var(--muted-foreground)}

/* ---- badges ---- */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:3px 9px;border-radius:999px;line-height:1.4}
.badge .dot{width:7px;height:7px;border-radius:50%}
.b-gray{background:var(--muted);color:var(--muted-foreground)}
.b-orange{background:rgba(234,88,12,.12);color:var(--primary)}
.b-green{background:rgba(22,163,74,.12);color:var(--success)}
.b-red{background:rgba(220,38,38,.12);color:var(--destructive)}
.b-yellow{background:rgba(217,119,7,.12);color:var(--warning)}
.b-blue{background:rgba(37,99,235,.12);color:#2563eb}

/* ---- tables ---- */
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{text-align:left;font-weight:500;color:var(--muted-foreground);font-size:12px;text-transform:uppercase;letter-spacing:.03em;padding:10px 12px;border-bottom:1px solid var(--border)}
.table td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.table tr:last-child td{border-bottom:none}
.table-wrap{overflow-x:auto}

/* ---- layout: header + sidebar ---- */
.header{position:sticky;top:0;z-index:50;height:var(--header-h);border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--background) 88%,transparent);backdrop-filter:blur(8px);display:flex;align-items:center;gap:8px;padding:0 16px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;letter-spacing:-.01em;font-size:16px}
.brand .bee{color:var(--primary)}
.brand .dotdev{font-size:11px;color:var(--muted-foreground);font-weight:400}
.logo{width:26px;height:26px;border-radius:7px;background:var(--primary);display:flex;align-items:center;justify-content:center;color:#fff}
.logo svg{width:16px;height:16px}
.header-right{margin-left:auto;display:flex;align-items:center;gap:6px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px}

.sidebar{position:fixed;top:var(--header-h);bottom:0;left:0;width:var(--sidebar-w);border-right:1px solid var(--border);background:var(--shell);display:flex;flex-direction:column;z-index:30}
.sidebar nav{flex:1;overflow-y:auto;padding:16px 12px;display:flex;flex-direction:column;gap:2px}
.nav-link{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;font-size:14px;font-weight:500;color:var(--muted-foreground);transition:all .15s}
.nav-link:hover{background:var(--muted);color:var(--foreground)}
.nav-link.active{background:var(--card);color:var(--primary);box-shadow:0 0 0 1px var(--border)}
.nav-link svg{width:18px;height:18px;flex-shrink:0}
.sidebar-foot{padding:12px 16px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted-foreground)}

.main{padding:24px 16px 80px;max-width:1100px;margin:0 auto}
@media(min-width:768px){.main{padding:28px 32px 40px;margin-left:var(--sidebar-w);margin-right:0;max-width:none}}

.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:24px}
.page-head h2{font-size:22px;font-weight:600;letter-spacing:-.02em}
.page-head p{font-size:14px;color:var(--muted-foreground);margin-top:4px}

/* ---- stats ---- */
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:24px}
@media(min-width:640px){.stats-grid{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.stat .v{font-size:24px;font-weight:600;font-family:var(--mono);font-variant-numeric:tabular-nums}
.stat .k{font-size:12px;color:var(--muted-foreground);margin-top:4px;text-transform:capitalize}

.grid2{display:grid;gap:20px;grid-template-columns:1fr}
@media(min-width:900px){.grid2{grid-template-columns:1fr 1fr}}
.section{margin-bottom:24px}
.empty{padding:40px 20px;text-align:center;color:var(--muted-foreground);font-size:14px}
.empty svg{width:32px;height:32px;opacity:.4;margin-bottom:8px}

/* ---- auth ---- */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--background)}
.auth-card{width:100%;max-width:400px}
.auth-tabs{display:flex;gap:4px;background:var(--muted);padding:4px;border-radius:10px;margin-bottom:20px}
.auth-tab{flex:1;padding:8px;border-radius:7px;font-size:14px;font-weight:500;color:var(--muted-foreground)}
.auth-tab.active{background:var(--card);color:var(--foreground);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--foreground);color:var(--background);padding:10px 18px;border-radius:8px;font-size:14px;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.18);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
.toast.err{background:var(--destructive);color:#fff}

/* mobile bottom nav */
.mobnav{position:fixed;bottom:0;left:0;right:0;z-index:40;border-top:1px solid var(--border);background:color-mix(in srgb,var(--shell) 92%,transparent);backdrop-filter:blur(8px);display:none;height:60px;align-items:center;justify-content:space-around}
@media(max-width:767px){.mobnav{display:flex}.sidebar{display:none}}
.mobnav-link{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--muted-foreground);padding:6px 10px}
.mobnav-link.active{color:var(--primary)}
.mobnav-link svg{width:20px;height:20px}
.hidden{display:none!important}
.muted{color:var(--muted-foreground)}
.row{display:flex;align-items:center;gap:8px}
.gap8{gap:8px}.gap12{gap:12px}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mb8{margin-bottom:8px}.mb16{margin-bottom:16px}
.copy{font-family:var(--mono);font-size:12px;background:var(--muted);padding:8px 10px;border-radius:6px;word-break:break-all;flex:1}
</style>
</head>
<body>

<!-- AUTH -->
<div id="authView" class="auth-wrap hidden">
  <div class="auth-card card card-pad">
    <div class="brand mb16"><span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2z"/></svg></span><span>open<span class="bee">OTP</span><span class="dotdev">.dev</span></span></div>
    <div class="auth-tabs">
      <button class="auth-tab active" id="tabLogin" onclick="switchAuth('login')">Log in</button>
      <button class="auth-tab" id="tabRegister" onclick="switchAuth('register')">Create account</button>
    </div>
    <form id="authForm" onsubmit="return doAuth(event)">
      <div class="field"><label>Email</label><input class="input" type="email" id="email" required placeholder="you@example.com"></div>
      <div class="field"><label>Password</label><input class="input" type="password" id="password" required placeholder="••••••••"></div>
      <button class="btn btn-primary btn-lg" style="width:100%" id="authBtn">Log in</button>
    </form>
    <p class="muted mt16" style="font-size:13px;text-align:center">Turn your Android phone into an SMS gateway.</p>
  </div>
</div>

<!-- APP -->
<div id="appView" class="hidden">
  <header class="header">
    <a class="brand" href="#"><span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2z"/></svg></span><span>open<span class="bee">OTP</span><span class="dotdev">.dev</span></span></a>
    <div class="header-right">
      <button class="btn btn-ghost btn-sm" id="themeBtn" onclick="toggleTheme()" title="Toggle theme"></button>
      <div style="display:flex;align-items:center;gap:8px">
        <div class="avatar" id="avatar">?</div>
        <button class="btn btn-ghost btn-sm" onclick="logout()">Log out</button>
      </div>
    </div>
  </header>

  <aside class="sidebar">
    <nav id="sideNav"></nav>
    <div class="sidebar-foot"><span>Need help?</span><a href="#" style="color:var(--primary);font-weight:500">Quick start</a></div>
  </aside>

  <main class="main" id="mainContent"></main>

  <nav class="mobnav" id="mobNav"></nav>
</div>

<div class="toast" id="toast"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
/* ============ openOTP dashboard — textbee-style ============ */
const $ = (s)=>document.querySelector(s);
const store = { token:null, user:null, devices:[], stats:{}, selDevice:null, section:'dashboard' };
const ICONS = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',
  send:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>',
  webhook:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M18 16.98h-5.99c-1.1 0-1.95.94-2.48 1.9A4 4 0 0 1 2 17c.01-.66.27-1.3.8-1.8"/><path d="M7.8 5.8A4 4 0 0 1 14 4c1.1 0 1.95.94 2.48 1.9A4 4 0 0 1 22 7c-.01.66-.27 1.3-.8 1.8"/><circle cx="12" cy="12" r="3"/></svg>',
  user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
  key:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="7" cy="15" r="4"/><path d="m10 12 9-9 3 3-2 2-2-2-2 2-2-2"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M3 6h18M8 6V4h8v2m-9 0v14h10V6"/></svg>',
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
  sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>',
  inbox:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13L22 12v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6Z"/></svg>',
  sim:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M7 2h10a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/><path d="M8 2v4a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2V2"/><rect x="8.5" y="12" width="7" height="7" rx="1"/></svg>'
};
const NAV = [
  {id:'dashboard',label:'Dashboard',icon:'home'},
  {id:'messaging',label:'Messaging',icon:'send'},
  {id:'simcards',label:'SIM Cards',icon:'sim'},
  {id:'webhooks',label:'Webhooks',icon:'webhook'},
  {id:'account',label:'Account',icon:'user'},
];

function toast(msg,err){const t=$('#toast');t.textContent=msg;t.className='toast show'+(err?' err':'');clearTimeout(t._t);t._t=setTimeout(()=>t.className='toast',2600)}
async function api(path,opts={}){
  const h={'Content-Type':'application/json'};
  if(store.token)h['Authorization']='Bearer '+store.token;
  if(opts.apiKey)h['x-api-key']=opts.apiKey;
  const r=await fetch(path,{method:opts.method||'GET',headers:h,body:opts.body?JSON.stringify(opts.body):undefined});
  const txt=await r.text();
  const j=txt?JSON.parse(txt):{};
  if(!r.ok)throw new Error(j.error||('HTTP '+r.status));
  return j;
}
function fmtTime(ms){if(!ms)return'—';const d=new Date(typeof ms==='number'&&ms<1e12?ms:ms);return d.toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}
function esc(s){return String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function statusBadge(s){
  const m={pending:['b-gray','gray'],dispatched:['b-yellow','yellow'],sent:['b-blue','blue'],delivered:['b-green','green'],failed:['b-red','red'],received:['b-green','green']};
  const [cls,col]=m[s]||['b-gray','gray'];
  return `<span class="badge ${cls}"><span class="dot" style="background:var(--${col==='gray'?'muted-foreground':col})"></span>${esc(s)}</span>`;
}

/* ---- theme ---- */
function applyTheme(d){document.documentElement.classList.toggle('dark',d);$('#themeBtn').innerHTML=d?ICONS.sun:ICONS.mon;localStorage.setItem('otp_theme',d?'dark':'light')}
function toggleTheme(){applyTheme(!document.documentElement.classList.contains('dark'))}

/* ---- auth ---- */
let authMode='login';
function switchAuth(m){authMode=m;$('#tabLogin').classList.toggle('active',m==='login');$('#tabRegister').classList.toggle('active',m==='register');$('#authBtn').textContent=m==='login'?'Log in':'Create account'}
async function doAuth(e){e.preventDefault();
  const email=$('#email').value.trim(),password=$('#password').value;
  if(!email||!password)return false;
  $('#authBtn').disabled=true;
  try{
    const r=await api('/api/auth/'+authMode,{method:'POST',body:{email,password}});
    store.token=r.data.token;store.user=r.data.user;localStorage.setItem('otp_auth',JSON.stringify({token:store.token,user:store.user}));
    enterApp();
  }catch(err){toast(err.message,true)}finally{$('#authBtn').disabled=false}
  return false;
}
function logout(){localStorage.removeItem('otp_auth');store.token=null;store.user=null;$('#appView').classList.add('hidden');$('#authView').classList.remove('hidden');if(window._sock)window._sock.disconnect()}

/* ---- nav ---- */
function renderNav(){
  $('#sideNav').innerHTML=NAV.map(n=>`<a class="nav-link ${store.section===n.id?'active':''}" onclick="goSection('${n.id}')">${ICONS[n.icon]}<span>${n.label}</span></a>`).join('');
  $('#mobNav').innerHTML=NAV.map(n=>`<a class="mobnav-link ${store.section===n.id?'active':''}" onclick="goSection('${n.id}')">${ICONS[n.icon]}<span>${n.label}</span></a>`).join('');
}
function goSection(id){store.section=id;renderNav();renderSection()}

/* ---- data ---- */
async function loadStats(){try{const r=await api('/gateway/stats');store.stats=r.data}catch{}}
async function loadDevices(){try{const r=await api('/gateway/devices');store.devices=r.data||[];if(!store.selDevice&&store.devices.length)store.selDevice=store.devices[0].id}catch{}}
async function loadMessages(){if(!store.selDevice)return[];try{const r=await api(`/gateway/devices/${store.selDevice}/sms?limit=100`);return r.data||[]}catch{return[]}}

/* ---- render sections ---- */
function renderSection(){const m=$('#mainContent');
  if(store.section==='dashboard')m.innerHTML=dashboardHtml();
  else if(store.section==='messaging')m.innerHTML=messagingHtml();
  else if(store.section==='simcards')m.innerHTML=simcardsHtml();
  else if(store.section==='webhooks')m.innerHTML=webhooksHtml();
  else if(store.section==='account')m.innerHTML=accountHtml();
  if(store.section==='dashboard'||store.section==='messaging')afterRender();
}
function statsHtml(){const s=store.stats;const items=[['Devices',s.devices],['Online',s.devicesOnline],['Sent',s.sent],['Received',s.received],['Pending',s.pending],['Delivered',s.delivered],['Failed',s.failed]];
  return `<div class="stats-grid">${items.map(([k,v])=>`<div class="stat"><div class="v">${v??0}</div><div class="k">${k}</div></div>`).join('')}</div>`}
function deviceRows(){return store.devices.map(d=>`<tr style="cursor:pointer" onclick="selectDevice('${d.id}')">
  <td><div class="row"><span class="badge ${d.online?'b-green':'b-gray'}"><span class="dot" style="background:var(--${d.online?'success':'muted-foreground'})"></span></span>${esc(d.brand||'?')} ${esc(d.model||'')}</div></td>
  <td class="muted">${esc(d.osVersion||'—')}</td>
  <td class="mono">${d.sentSMSCount||0}/${d.receivedSMSCount||0}</td>
  <td>${d.enabled?statusBadge('delivered').replace('delivered','enabled'):statusBadge('failed').replace('failed','disabled')}</td>
  <td><button class="btn btn-ghost btn-sm btn-destructive" onclick="event.stopPropagation();delDevice('${d.id}')">${ICONS.trash}</button></td>
</tr>`).join('')}
function dashboardHtml(){
  const u=store.user?.email?.split('@')[0]||'there';
  return `<div class="page-head"><div><h2>Welcome back, ${esc(u)}</h2><p>Here's what's happening with your SMS gateway</p></div>
    <div class="row gap8"><button class="btn btn-primary btn-sm" onclick="goSection('messaging')">${ICONS.send} Send SMS</button></div></div>
  ${statsHtml()}
  <div class="grid2">
    <div class="card"><div class="card-header"><span class="card-title">Registered Devices</span><button class="btn btn-outline btn-sm" onclick="toast('Use the Android app to register a device')">${ICONS.plus} Add device</button></div>
      <div class="table-wrap">${store.devices.length?`<table class="table"><thead><tr><th>Device</th><th>OS</th><th>Sent/Recv</th><th>Status</th><th></th></tr></thead><tbody>${deviceRows()}</tbody></table>`:`<div class="empty">${ICONS.inbox}<div>No devices yet. Install the Android app and connect with your API key.</div></div>`}</div></div>
    <div class="card"><div class="card-header"><span class="card-title">API Key</span></div><div class="card-pad">
      <p class="label mb8">Your API key</p><div class="row"><code class="copy" id="akCopy">${esc(store.user?.apiKey||'')}</code><button class="btn btn-outline btn-sm" onclick="copyKey()">${ICONS.copy} Copy</button></div>
      <button class="btn btn-outline btn-sm mt16" onclick="rotateKey()">${ICONS.key} Rotate API key</button>
      <p class="hint mt8">Use this key in the Android app or as the <code>x-api-key</code> header for REST calls.</p>
    </div></div>
  </div>`;
}
function messagingHtml(){
  const dev=store.devices.find(d=>d.id===store.selDevice);
  const opts=store.devices.map(d=>`<option value="${d.id}" ${d.id===store.selDevice?'selected':''}>${esc(d.brand||'?')} ${esc(d.model||'')} ${d.online?'●':'○'}</option>`).join('');
  return `<div class="page-head"><div><h2>Messaging</h2><p>Send SMS and view message history</p></div></div>
  <div class="card section"><div class="card-header"><span class="card-title">Send SMS</span></div><div class="card-pad">
    <div class="field"><label>Device</label><select class="select" id="selDev" onchange="store.selDevice=this.value;renderSection()">${opts||'<option>No devices</option>'}</select></div>
    <div class="field"><label>SIM Card</label><select class="select" id="selSim">${simOptions(dev)}</select></div>
    <div class="field"><label>Recipients</label><textarea class="textarea" id="recip" placeholder="+1234567890, +1987654321 (one per line or comma-separated)"></textarea></div>
    <div class="field"><label>Message</label><textarea class="textarea" id="msg" placeholder="Your verification code is 123456" maxlength="160"></textarea><span class="hint" id="cnt">0 / 160</span></div>
    <button class="btn btn-primary" id="sendBtn" onclick="sendSms()">${ICONS.send} Send SMS</button>
  </div></div>
  <div class="card section"><div class="card-header"><span class="card-title">Message History</span><span class="muted" style="font-size:13px">${dev?esc(dev.brand+' '+dev.model):'No device'}</span></div>
    <div class="table-wrap" id="histWrap"><div class="empty">Loading…</div></div></div>`;
}
let simDirty=false;
function simcardsHtml(){
  const dev=store.devices.find(d=>d.id===store.selDevice);
  const sims=(dev&&dev.simInfo&&Array.isArray(dev.simInfo.sims))?dev.simInfo.sims:[];
  const r=(dev&&dev.simRouting)||{};
  const opts=store.devices.map(d=>`<option value="${d.id}" ${d.id===store.selDevice?'selected':''}>${esc(d.brand||'?')} ${esc(d.model||'')} ${d.online?'●':'○'}</option>`).join('');
  const simRows=sims.map(s=>`<tr><td class="mono">${s.slotIndex??'—'}</td><td>${esc(s.carrierName||'—')}</td><td>${esc(s.displayName||'—')}</td><td class="mono">${esc(s.number||'—')}</td><td class="mono">${s.subscriptionId??'—'}</td><td>${s.source==='manual'?'<span class="badge b-orange">manual</span>':'<span class="badge b-green">detected</span>'}</td></tr>`).join('');
  const simOpts=sims.filter(s=>s.subscriptionId!=null).map(s=>`<option value="${s.subscriptionId}|${s.slotIndex??''}" ${r.mode==='sim'&&r.subscriptionId===s.subscriptionId?'selected':''}>Always use — Slot ${s.slotIndex??'?'} (${esc(s.carrierName||s.displayName||'SIM')})</option>`).join('');
  return `<div class="page-head"><div><h2>SIM Cards</h2><p>SIM cards reported by your devices and default routing</p></div></div>
  <div class="card section"><div class="card-header"><span class="card-title">Device</span></div><div class="card-pad">
    <select class="select" onchange="store.selDevice=this.value;simDirty=false;renderSection()">${opts||'<option>No devices</option>'}</select>
  </div></div>
  <div class="card section"><div class="card-header"><span class="card-title">Available SIM Cards</span><span class="muted" style="font-size:13px">${dev?(dev.online?'● online':'○ offline'):''}</span></div><div class="card-pad">
    ${sims.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Slot</th><th>Carrier</th><th>Name</th><th>Number</th><th>Subscription ID</th><th>Source</th></tr></thead><tbody>${simRows}</tbody></table></div>`:`<div class="empty">${ICONS.sim}<div>No SIM cards reported yet. Connect the Android app — SIMs are reported on connect and every heartbeat (30s). You can also register SIMs manually in the Android app's SIM Cards tab.</div></div>`}
  </div></div>
  <div class="card section"><div class="card-header"><span class="card-title">Default SIM Routing</span></div><div class="card-pad">
    <p class="hint mb8">Applied to API sends that don't specify a SIM, and used as the default in Messaging. The per-send SIM choice in Messaging overrides this.</p>
    <div class="field"><label>Routing mode</label>
      <select class="select" id="simMode" onchange="simDirty=true">
        <option value="any" ${(!r.mode||r.mode==='any')?'selected':''}>Phone default — let the phone pick a SIM</option>
        ${simOpts}
        <option value="roundrobin" ${r.mode==='roundrobin'?'selected':''}>Round-robin — alternate across all SIMs (great for API sends)</option>
      </select>
    </div>
    <button class="btn btn-primary" onclick="saveSimRouting()">${ICONS.key} Save routing</button>
  </div></div>`;
}
async function saveSimRouting(){
  const v=$('#simMode').value;
  let simRouting={mode:'any'};
  if(v==='roundrobin')simRouting={mode:'roundrobin'};
  else if(v.includes('|')){const p=v.split('|');simRouting={mode:'sim',subscriptionId:Number(p[0]),slotIndex:p[1]===''?null:Number(p[1])}}
  try{await api(`/gateway/devices/${store.selDevice}`,{method:'PATCH',body:{simRouting}});toast('SIM routing saved');simDirty=false;await loadDevices();renderSection()}
  catch(e){toast(e.message,true)}
}
function simOptions(dev){
  const sims=(dev&&dev.simInfo&&Array.isArray(dev.simInfo.sims))?dev.simInfo.sims:[];
  const r=(dev&&dev.simRouting)||{};
  let def='Device default (phone picks SIM)';
  if(r.mode==='roundrobin')def='Device default (round-robin all SIMs)';
  else if(r.mode==='sim')def='Device default ('+(sims.find(s=>s.subscriptionId===r.subscriptionId)?.carrierName||'configured SIM')+')';
  let out=`<option value="">${esc(def)}</option>`;
  for(const s of sims)if(s.subscriptionId!=null)out+=`<option value="${s.subscriptionId}|${s.slotIndex??''}">Slot ${s.slotIndex??'?'} — ${esc(s.carrierName||s.displayName||'SIM')}</option>`;
  return out;
}
function webhooksHtml(){return `<div class="page-head"><div><h2>Webhooks</h2><p>Get notified at your endpoints when SMS events happen</p></div></div>
  <div class="card card-pad empty">${ICONS.webhook}<div style="margin-top:8px">Webhooks are coming soon. This is where you'll configure URLs to receive <code>sms.sent</code>, <code>sms.delivered</code>, and <code>sms.received</code> events.</div></div>`}
function accountHtml(){return `<div class="page-head"><div><h2>Account</h2><p>Manage your account and API access</p></div></div>
  <div class="grid2">
    <div class="card"><div class="card-header"><span class="card-title">Profile</span></div><div class="card-pad">
      <div class="field"><label>Email</label><input class="input" value="${esc(store.user?.email||'')}" disabled></div>
      <p class="hint">Account created ${fmtTime(store.user?.createdAt)}</p>
    </div></div>
    <div class="card"><div class="card-header"><span class="card-title">API Key</span></div><div class="card-pad">
      <p class="label mb8">Your API key</p><div class="row"><code class="copy">${esc(store.user?.apiKey||'')}</code><button class="btn btn-outline btn-sm" onclick="copyKey()">${ICONS.copy} Copy</button></div>
      <button class="btn btn-outline btn-sm mt16" onclick="rotateKey()">${ICONS.key} Rotate API key</button>
      <p class="hint mt8">Rotating invalidates the old key immediately.</p>
    </div></div>
  </div>`}

/* ---- actions ---- */
async function afterRender(){
  if(store.section==='messaging'){const t=$('#msg');if(t)t.oninput=()=>$('#cnt').textContent=t.value.length+' / 160';await refreshHistory()}
}
async function refreshHistory(){const w=$('#histWrap');if(!w)return;const msgs=await loadMessages();
  if(!msgs.length){w.innerHTML=`<div class="empty">${ICONS.inbox}<div>No messages yet.</div></div>`;return}
  w.innerHTML=`<table class="table"><thead><tr><th>Type</th><th>From / To</th><th>Message</th><th>Status</th><th>Time</th></tr></thead><tbody>${msgs.map(m=>`<tr>
    <td><span class="badge ${m.type==='sent'?'b-orange':'b-blue'}">${m.type}</span></td>
    <td class="mono">${esc(m.type==='sent'?m.recipient:m.sender)||'—'}</td>
    <td style="max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(m.message)}</td>
    <td>${statusBadge(m.status)}</td>
    <td class="muted" style="font-size:12px">${fmtTime(m.sentAt||m.receivedAt||m.createdAt)}</td>
  </tr>`).join('')}</tbody></table>`;
}
function selectDevice(id){store.selDevice=id;goSection('messaging')}
async function sendSms(){const r=$('#recip').value,msg=$('#msg').value;
  const recipients=r.split(/[\n,]/).map(x=>x.trim()).filter(Boolean);
  if(!store.selDevice)return toast('Select a device first',true);
  if(!recipients.length||!msg)return toast('Add recipients and a message',true);
  const body={recipients,message:msg};
  const simSel=$('#selSim')?$('#selSim').value:'';
  if(simSel){const p=simSel.split('|');body.simSubscriptionId=Number(p[0]);body.simSlotIndex=p[1]===''?null:Number(p[1])}
  $('#sendBtn').disabled=true;
  try{const res=await api(`/gateway/devices/${store.selDevice}/send-sms`,{method:'POST',body});toast(`Sent to ${res.data.count} recipient(s)`);$('#recip').value='';$('#msg').value='';$('#cnt').textContent='0 / 160';await refreshHistory();await loadStats()}
  catch(e){toast(e.message,true)}finally{$('#sendBtn').disabled=false}
}
async function delDevice(id){if(!confirm('Delete this device?'))return;try{await api(`/gateway/devices/${id}`,{method:'DELETE'});toast('Device deleted');await loadDevices();renderSection()}catch(e){toast(e.message,true)}}
function copyKey(){navigator.clipboard.writeText(store.user?.apiKey||'').then(()=>toast('API key copied'))}
async function rotateKey(){try{const r=await api('/api/auth/api-key',{method:'POST'});store.user=r.data;localStorage.setItem('otp_auth',JSON.stringify({token:store.token,user:store.user}));toast('API key rotated');renderSection()}catch(e){toast(e.message,true)}}

/* ---- live ---- */
let pollT=null;
function startLive(){if(window._sock)return;try{window._sock=io();window._sock.on('change',refresh)}catch{}
pollT=setInterval(refresh,5000)}
async function refresh(){
  await loadStats();
  await loadDevices();
  if(store.section==='dashboard'){renderSection();return}
  if(store.section==='simcards'&&!simDirty){renderSection();return}
  if(store.section!=='messaging')return;
  refreshHistory();
}

/* ---- boot ---- */
function enterApp(){
  $('#authView').classList.add('hidden');$('#appView').classList.remove('hidden');
  $('#avatar').textContent=(store.user?.email||'?')[0].toUpperCase();
  renderNav();
  (async()=>{await loadDevices();await loadStats();renderSection();startLive()})();
}
function init(){
  applyTheme(localStorage.getItem('otp_theme')==='dark');
  const saved=localStorage.getItem('otp_auth');
  if(saved){try{const o=JSON.parse(saved);store.token=o.token;store.user=o.user;
    api('/api/auth/me').then(()=>enterApp()).catch(()=>{localStorage.removeItem('otp_auth');$('#authView').classList.remove('hidden')});
  }catch{$('#authView').classList.remove('hidden')}}else{$('#authView').classList.remove('hidden')}
}
init();
</script>
</body>
</html>
